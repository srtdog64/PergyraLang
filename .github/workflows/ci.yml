name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make llvm-dev llvm coq

      - name: Run Linux CI target
        run: make ci-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc

      - name: Run Windows CI target
        shell: msys2 {0}
        run: CC=gcc make ci-windows

  build-macos-c-only:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run macOS C-only CI target
        run: |
          set -o pipefail
          CC=cc make ci-macos 2>&1 | tee macos-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 macos-ci.log > macos-ci-tail.log
            line_no=1
            while IFS= read -r line; do
              printf '::error file=macos-ci-tail.log,line=%s::%s\n' "$line_no" "$line"
              line_no=$((line_no + 1))
            done < macos-ci-tail.log
          fi
          exit "$status"
