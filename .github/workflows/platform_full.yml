name: Platform full

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * 0'
  push:
    tags:
      - 'v*'

concurrency:
  group: platform-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal-proofs-rocq9:
    uses: ./.github/workflows/formal_proofs.yml

  # The codegen seed (native pgy, gen0 -> gen2) and the installed driver built
  # from it are two owners in a row, as in push CI's codegen bootstrap and
  # backend-compare toolchain jobs. Run 43817349973 ran both, with the seed's
  # gates, in one 20-minute job and was cancelled during the DRV-2 emission.
  # The seed's two gates (and the parser AST producer only they use) run in
  # the codegen-seed-gates parity shard on this exact gen2.
  platform-full-linux-codegen-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::ForceIPv4 "true";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-pgy-ci-hardening >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc make llvm-dev llvm libomp-dev

      - name: Build the native compiler and the codegen seed once
        env:
          PGY_SELFHOST_CODEGEN_SEED_GATES: deferred
        run: make self-host-codegen-bootstrap-seed-test-smoke

      - name: Upload the native compiler
        uses: actions/upload-artifact@v4
        with:
          name: platform-full-linux-native
          if-no-files-found: error
          retention-days: 1
          path: bin/pgy

      - name: Upload the codegen seed
        uses: actions/upload-artifact@v4
        with:
          name: platform-full-linux-codegen-seed
          if-no-files-found: error
          retention-days: 1
          path: |
            .tmp/self_hosted/codegen/bootstrap/gen2.c
            .tmp/self_hosted/codegen/bootstrap/gen2.exe
            .tmp/self_hosted/codegen/bootstrap/codegen-seed.output.receipt
            .tmp/self_hosted/codegen/bootstrap/codegen-seed.prebuild.key

  platform-full-linux-toolchain:
    needs: platform-full-linux-codegen-seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::ForceIPv4 "true";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-pgy-ci-hardening >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc make llvm-dev llvm libomp-dev

      - name: Download the native compiler
        uses: actions/download-artifact@v4
        with:
          name: platform-full-linux-native
          path: bin

      - name: Download the codegen seed
        uses: actions/download-artifact@v4
        with:
          name: platform-full-linux-codegen-seed
          path: .tmp/self_hosted/codegen/bootstrap

      # The seed is admitted only if its receipt and key match this native
      # compiler and checkout; there is no rebuild fallback. The installed
      # driver and the self-host LSP then come from that exact gen2, so
      # platform-full-linux admits the LSP instead of rebuilding the seed,
      # DRV-2 and the LSP for its tooling conformance step.
      - name: Build the installed driver and LSP from the admitted seed
        env:
          PGY_BIN: ${{ github.workspace }}/bin/pgy
          PGY_SELFHOST_CC: gcc
        run: |
          chmod +x bin/pgy .tmp/self_hosted/codegen/bootstrap/gen2.exe
          PGY_SELFHOST_CODEGEN_SEED_MODE=prebuilt PGY_SELFHOST_CODEGEN_SEED_ONLY=1 \
          PGY_SELFHOST_CODEGEN_SEED_GATES=deferred \
            bash tests/self_hosted/parity/codegen/codegen_bootstrap.sh
          PGY_SELF_DRIVER_BIN="$PWD/bin/pgy-self-driver" \
            bash tests/self_hosted/parity/driver/self_host_compiler_build.sh
          PGY_SELF_LSP_BIN="$PWD/bin/pgy-self-lsp" \
            bash tests/self_hosted/parity/driver/self_host_lsp_build.sh

      - name: Upload installed Linux self-host toolchain
        uses: actions/upload-artifact@v4
        with:
          name: platform-full-linux-toolchain
          if-no-files-found: error
          retention-days: 1
          path: |
            bin/pgy
            bin/pgy-self-driver
            bin/pgy-self-driver.machine-layer-manifest.json
            bin/pgy-self-lsp

      # The DRV-2 C the admitted seed emitted above, with its receipt. The
      # Windows toolchain compiles exactly this C instead of emitting it again,
      # and the Windows codegen-seed shard requires its own seed to re-emit it.
      - name: Upload the DRV-2 source artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-full-drv2-source-artifact
          if-no-files-found: error
          retention-days: 1
          path: |
            .tmp/self_hosted/compiler/bootstrap/driver.c
            .tmp/self_hosted/compiler/bootstrap/driver.source-artifact.receipt

  platform-full-linux:
    needs: [platform-full-linux-toolchain, formal-proofs-rocq9]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::ForceIPv4 "true";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-pgy-ci-hardening >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc make llvm-dev llvm libomp-dev

      - name: Download installed Linux self-host toolchain
        uses: actions/download-artifact@v4
        with:
          name: platform-full-linux-toolchain
          path: bin

      - name: Validate executable Linux artifact permissions
        run: chmod +x bin/pgy bin/pgy-self-driver

      - name: Run Linux core and platform-independent contract
        env:
          PGY_CI_SELF_HOST_MODE: prebuilt
          PGY_CI_PLATFORM_PARITY_MODE: contract-only
          PGY_ALLOW_MISSING_COQ: "1"
        run: make PGY_BACKEND_COMPARE_JOBS=1 ci-linux

  platform-full-linux-self-host-parity:
    needs: platform-full-linux-toolchain
    runs-on: ubuntu-latest
    # Hang budget: the driver shard is the only leg here that runs two backend
    # lanes, and until the LLVM array element type was named it failed within
    # seconds at the driver compile instead of running the llvm lane at all.
    # The Windows shard needs 31 minutes for the c lane alone, so run
    # 34645314322 reached the former 30-minute ceiling with both lanes making
    # named-fixture progress. The other three legs finish in minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [parser, semantic, codegen, driver, harness-evidence, codegen-seed-gates]
    steps:
      - uses: actions/checkout@v6

      - name: Install parity dependencies
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "3";\nAcquire::ForceIPv4 "true";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-pgy-ci-hardening >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc make llvm-dev llvm libomp-dev

      - name: Download installed Linux self-host toolchain
        uses: actions/download-artifact@v4
        with:
          name: platform-full-linux-toolchain
          path: bin

      - name: Download the codegen seed the toolchain job built
        if: matrix.shard == 'codegen-seed-gates'
        uses: actions/download-artifact@v4
        with:
          name: platform-full-linux-codegen-seed
          path: .tmp/self_hosted/codegen/bootstrap

      - name: Run Linux self-host parity shard
        env:
          PGY_CI_SELF_HOST_PARITY_SHARD: ${{ matrix.shard }}
          PGY_CI_SELF_HOST_PARITY_BACKENDS: c llvm
        run: |
          chmod +x bin/pgy bin/pgy-self-driver
          export PGY_BIN="$PWD/bin/pgy"
          export PGY_SELF_DRIVER_BIN="$PWD/bin/pgy-self-driver"
          bash scripts/ci_self_host_platform_parity_shard_owner.sh

  # The Windows driver is the DRV-2 C the Linux toolchain emitted, compiled
  # here. Emitting it again here repeated the codegen seed bootstrap and the
  # DRV-2 emission on the critical path; the codegen-seed parity shard runs
  # this platform's seed and requires it to re-emit the same C.
  platform-full-windows-toolchain:
    needs: platform-full-linux-toolchain
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc

      - name: Download the DRV-2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: platform-full-drv2-source-artifact
          path: .tmp/self_hosted/compiler/admitted

      - name: Build the native Windows compiler once
        shell: msys2 {0}
        run: CC=gcc make LLVM_ENABLED=0 compiler

      - name: Compile the admitted DRV-2 source artifact into the installed driver
        shell: msys2 {0}
        env:
          PGY_SELFHOST_DRIVER_SOURCE_ARTIFACT_MODE: adopt
          PGY_SELFHOST_CC: gcc
        run: |
          PGY_BIN="$PWD/bin/pgy.exe" \
          PGY_SELF_DRIVER_BIN="$PWD/bin/pgy-self-driver.exe" \
          PGY_SELFHOST_DRIVER_SOURCE_ARTIFACT_C="$PWD/.tmp/self_hosted/compiler/admitted/driver.c" \
          PGY_SELFHOST_DRIVER_SOURCE_ARTIFACT_RECEIPT="$PWD/.tmp/self_hosted/compiler/admitted/driver.source-artifact.receipt" \
            bash tests/self_hosted/parity/driver/self_host_compiler_build.sh

      - name: Upload installed Windows self-host toolchain
        uses: actions/upload-artifact@v4
        with:
          name: platform-full-windows-toolchain
          if-no-files-found: error
          retention-days: 1
          path: |
            bin/pgy.exe
            bin/pgy-self-driver.exe
            bin/pgy-self-driver.machine-layer-manifest.json

  platform-full-windows:
    needs: platform-full-windows-toolchain
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PGY_ALLOW_MISSING_COQ: 1
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            diffutils
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc

      - name: Download installed Windows self-host toolchain
        uses: actions/download-artifact@v4
        with:
          name: platform-full-windows-toolchain
          path: bin

      - name: Validate executable Windows artifact permissions
        shell: msys2 {0}
        run: chmod +x bin/pgy.exe bin/pgy-self-driver.exe

      - name: Run Windows core and platform-independent contract
        shell: msys2 {0}
        env:
          PGY_CI_SELF_HOST_MODE: prebuilt
          PGY_CI_PLATFORM_PARITY_MODE: contract-only
        run: CC=gcc make ci-windows

      - name: Upload driver-rung2 negative-leg evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-driver-rung2-evidence
          if-no-files-found: ignore
          retention-days: 3
          path: |
            .tmp/self_hosted/driver_rung2/*abi-layout-baseline*
            .tmp/self_hosted/driver_rung2/*missing-abi-layout-fact*
            .tmp/self_hosted/driver_rung2/*wrong-abi-layout-identity*
            .tmp/self_hosted/driver_rung2/device_slot_routine*

  platform-full-windows-self-host-parity:
    needs: [platform-full-linux-toolchain, platform-full-windows-toolchain]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [parser, semantic, codegen, driver, codegen-seed]
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc

      - name: Download installed Windows self-host toolchain
        uses: actions/download-artifact@v4
        with:
          name: platform-full-windows-toolchain
          path: bin

      - name: Download the DRV-2 source artifact the installed driver was compiled from
        if: matrix.shard == 'codegen-seed'
        uses: actions/download-artifact@v4
        with:
          name: platform-full-drv2-source-artifact
          path: .tmp/self_hosted/compiler/admitted

      - name: Run Windows self-host parity shard
        shell: msys2 {0}
        env:
          PGY_CI_SELF_HOST_PARITY_SHARD: ${{ matrix.shard }}
          PGY_CI_SELF_HOST_PARITY_BACKENDS: c
          PGY_AIR_GRAPH_JSON_SKIP_DRIFT: 1
        run: |
          chmod +x bin/pgy.exe bin/pgy-self-driver.exe
          export PGY_BIN="$PWD/bin/pgy.exe"
          export PGY_SELF_DRIVER_BIN="$PWD/bin/pgy-self-driver.exe"
          bash scripts/ci_self_host_platform_parity_shard_owner.sh

  platform-full-macos-c-only:
    runs-on: macos-latest
    # Hang budget: this leg has no separate parity shard, so its one job runs
    # the whole ci-macos list including the DRV-2 driver corpus at step 31.
    # Until the seed bootstrap was repaired it failed at step 3 and never
    # reached that corpus; run 34633676141 then spent the former 45-minute
    # ceiling inside it while still making named-gate progress. Allow the
    # Windows core budget plus its parity shard, which is the same work.
    timeout-minutes: 100
    env:
      PGY_ALLOW_MISSING_COQ: 1
    steps:
      - uses: actions/checkout@v6

      - name: Run full macOS C-only platform target
        run: |
          set +e
          set -o pipefail
          CC=cc make ci-macos 2>&1 | tee macos-ci.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 10 macos-ci.log > macos-ci-tail.log
            line_no=1
            while IFS= read -r line; do
              printf '::error file=macos-ci-tail.log,line=%s::%s\n' "$line_no" "$line"
              line_no=$((line_no + 1))
            done < macos-ci-tail.log
          fi
          exit "$status"
